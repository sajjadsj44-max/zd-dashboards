name: Publish dashboards to GitHub Pages

# GitHub Pages serves the `gh-pages` branch. This keeps that branch an exact
# mirror of `main`, so pushing a dashboard update to `main` is all it takes for
# the live links to change for everyone.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Mirror main onto gh-pages
        run: git push --force origin HEAD:gh-pages
